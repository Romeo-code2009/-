<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>邦康街头市集 | 泰国货源</title>
    <!-- Google Fonts & 字体图标 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0c0b0a;
            font-family: 'Inter', sans-serif;
            color: #e9e3d5;
            padding-bottom: 30px;
        }

        /* 街头纹理背景 & 粗粝感 */
        .street-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255, 200, 80, 0.02) 0px, rgba(255, 200, 80, 0.02) 2px, transparent 2px, transparent 8px),
                              radial-gradient(circle at 10% 20%, rgba(230, 100, 40, 0.08) 0%, rgba(0, 0, 0, 0.4) 90%);
            pointer-events: none;
            z-index: -2;
        }

        /* 喷溅涂鸦点缀 */
        .street-bg::after {
            content: "";
            position: fixed;
            bottom: 0;
            right: 0;
            width: 180px;
            height: 180px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23ff5e3a" opacity="0.2" d="M20,30 Q40,10 60,30 T90,50 L80,80 Q60,90 40,85 L15,70 Q5,50 20,30Z"/><circle fill="%23ffb347" opacity="0.2" cx="70" cy="25" r="12"/></svg>');
            background-size: cover;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 18px 40px;
            position: relative;
            z-index: 2;
        }

        /* 头部区域 街头味道 */
        .hero {
            text-align: left;
            margin-bottom: 28px;
            border-left: 6px solid #ff8c42;
            padding-left: 16px;
        }
        .hero h1 {
            font-family: 'Rubik Mono One', monospace;
            font-size: 2.1rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffb347, #ff6b4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            margin-bottom: 6px;
        }
        .hero .sub {
            font-size: 0.85rem;
            font-weight: 500;
            color: #f0bc7c;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }
        .hero .location {
            margin-top: 10px;
            font-size: 0.75rem;
            background: #1f1b16;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            color: #ffb274;
            font-weight: 600;
        }
        .hero .location i {
            margin-right: 5px;
        }

        /* 分类板块 */
        .category {
            margin-bottom: 36px;
        }
        .category-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 2px dashed #ff8c42;
            padding-bottom: 8px;
        }
        .category-title h2 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(145deg, #f5c27b, #f28b42);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .category-title span {
            font-size: 0.7rem;
            background: #2a241e;
            padding: 2px 12px;
            border-radius: 40px;
            color: #ffb851;
        }

        /* 商品网格 (两列) */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* 卡片设计 街头质感 */
        .product-card {
            background: rgba(25, 22, 20, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 28px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.2s;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 140, 66, 0.3);
            cursor: pointer;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .product-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: block;
            background: #2f2a24;
        }
        .product-card:hover .product-img {
            filter: brightness(1.05) contrast(1.05);
        }
        .product-info {
            padding: 12px 12px 14px;
        }
        .product-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-price {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffb347;
            letter-spacing: 0.5px;
        }
        .price-unit {
            font-size: 0.7rem;
            font-weight: normal;
            color: #ccaa7a;
        }
        .buy-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            background: linear-gradient(95deg, #ff7e35, #ff5722);
            border: none;
            border-radius: 60px;
            padding: 10px 0;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1e1b17;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }
        .buy-btn i {
            margin-right: 6px;
            font-size: 0.75rem;
        }
        .buy-btn:active {
            transform: scale(0.96);
            background: linear-gradient(95deg, #ff6a2c, #f2440e);
        }

        /* 轮播广告区 */
        .carousel-section {
            margin-top: 40px;
            margin-bottom: 15px;
            border-radius: 32px;
            overflow: hidden;
            background: #12100e;
            box-shadow: 0 12px 28px rgba(0,0,0,0.6);
            border: 1px solid #ff8c4255;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            position: relative;
        }
        .carousel-slide img {
            width: 100%;
            aspect-ratio: 3 / 1.2;
            object-fit: cover;
            display: block;
            background: #2f2a1f;
        }
        .slide-caption {
            position: absolute;
            bottom: 10px;
            left: 12px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #ffd29b;
        }
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 0;
            background: #1b1713;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #6b5a4a;
            border-radius: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .dot.active {
            width: 26px;
            background-color: #ff8c42;
        }

        /* 模态框 (商品弹窗 灵动动画) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.show {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            max-width: 85%;
            max-height: 80%;
            background: #1f1b17;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
            border: 1px solid #ffa559;
            position: relative;
            animation: floatPop 0.4s forwards;
        }
        .modal.show .modal-content {
            transform: scale(1);
        }
        @keyframes floatPop {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-img {
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            background: #1a1612;
            display: block;
        }
        .modal-info {
            padding: 20px;
            text-align: center;
            background: linear-gradient(0deg, #1e1915, #2b241e);
        }
        .modal-info h3 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffbc6e;
        }
        .modal-info p {
            font-size: 0.85rem;
            margin: 8px 0;
        }
        .close-modal {
            position: absolute;
            top: 12px;
            right: 18px;
            background: rgba(0,0,0,0.6);
            width: 34px;
            height: 34px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .close-modal:active {
            background: #ff5722;
        }

        /* 购买提示toast 灵动效果 */
        .toast-notify {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #2b241eff;
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            color: #ffd49f;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1100;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border-left: 5px solid #ff9142;
            transition: all 0.25s ease;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-notify.show-toast {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 辅助文字 */
        .brand-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #b6a184;
            letter-spacing: 0.5px;
            border-top: 1px dashed #ff8c4244;
            padding-top: 20px;
        }

        /* 触摸优化 */
        button, .buy-btn, .product-card {
            cursor: pointer;
            user-select: none;
        }
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }
    </style>
</head>
<body>
<div class="street-bg"></div>
<div class="container">
    <!-- 头部街头气息 -->
    <div class="hero">
        <h1>BANGKHANG <br> STREET MARKET</h1>
        <div class="sub"><i class="fas fa-fire"></i> 直采泰国 · 街头灵感</div>
        <div class="location"><i class="fas fa-map-marker-alt"></i> 货源：泰国 | 售卖地：邦康</div>
    </div>

    <!-- 分类1：泰式街头美食 -->
    <div class="category">
        <div class="category-title">
            <h2>🍜 街头美食</h2>
            <span>泰味十足</span>
        </div>
        <div class="products-grid" id="food-grid"></div>
    </div>

    <!-- 分类2：手工匠艺 -->
    <div class="category">
        <div class="category-title">
            <h2>✨ 手作艺品</h2>
            <span>匠人精神</span>
        </div>
        <div class="products-grid" id="craft-grid"></div>
    </div>

    <!-- 分类3：潮流服饰 -->
    <div class="category">
        <div class="category-title">
            <h2>👕 邦康潮搭</h2>
            <span>街头不羁</span>
        </div>
        <div class="products-grid" id="cloth-grid"></div>
    </div>

    <!-- 底部自动轮播广告展览 (广告切换) -->
    <div class="carousel-section">
        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <!-- 动态插入轮播图片 广告创意 -->
            </div>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
    </div>
    <div class="brand-note">
        <i class="fas fa-truck"></i> 邦康直邮 · 泰国正宗风味 · 街头灵魂
    </div>
</div>

<!-- 模态框结构 -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-modal"><i class="fas fa-times"></i></span>
        <img id="modalImage" class="modal-img" alt="商品大图">
        <div class="modal-info">
            <h3 id="modalTitle"></h3>
            <p id="modalDesc">来自泰国邦康的街头珍品，点击购买即刻感受东南亚风情。</p>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notify">✨ 已加入街头购物车 · 邦康发货 ✨</div>

<script>
    // ----- 商品数据 (三个分类，每个分类2~3件商品，体现泰国+街头)
    const categoriesData = {
        food: [
            { id: 'f1', name: '泰式炒河粉 Pad Thai', price: '89', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1559314809-0d155014e29e?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1559314809-0d155014e29e?w=800&fit=crop', desc: '地道邦康夜市风味，酸辣鲜香' },
            { id: 'f2', name: '手标泰奶 冰醇版', price: '55', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1551024601-bec6debe49b4?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1551024601-bec6debe49b4?w=800&fit=crop', desc: '浓郁茶香，邦康街头饮品销量王' },
            { id: 'f3', name: '芒果糯米饭', price: '79', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1585937421615-70a00f0dca7b?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1585937421615-70a00f0dca7b?w=800&fit=crop', desc: '新鲜芒果+椰浆糯米饭，甜而不腻' }
        ],
        craft: [
            { id: 'c1', name: '泰北手工编织篮', price: '199', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1546868114-5c9f6f6c246e?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1546868114-5c9f6f6c246e?w=800&fit=crop', desc: '天然水草编织，邦康手艺人作品' },
            { id: 'c2', name: '香薰精油蜡烛', price: '159', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1600857544200-b2f666b9a2ec?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1600857544200-b2f666b9a2ec?w=800&fit=crop', desc: '柠檬草与茉莉，宁静治愈' },
            { id: 'c3', name: '泰国手工皂礼盒', price: '129', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1600857544200-b2f666b9a2ec?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1616612423959-4391e70db7b7?w=800&fit=crop', desc: '天然植物配方，邦康热卖伴手礼' }
        ],
        clothing: [
            { id: 'cl1', name: '大象图腾印花Tee', price: '299', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1567225557594-88d73e55f2cb?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1567225557594-88d73e55f2cb?w=800&fit=crop', desc: '棉麻透气，街头艺术印花' },
            { id: 'cl2', name: '泰式阔腿裤', price: '349', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1609867364365-1f0c970b7de2?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1609867364365-1f0c970b7de2?w=800&fit=crop', desc: '轻盈飘逸，邦康市集爆款' },
            { id: 'cl3', name: '泼水节印花方巾', price: '99', priceUnit: 'THB', img: 'https://images.unsplash.com/photo-1516762689617-e1cffcef479d?w=400&h=400&fit=crop', modalImg: 'https://images.unsplash.com/photo-1516762689617-e1cffcef479d?w=800&fit=crop', desc: '多彩民族风，街头搭配神器' }
        ]
    };

    // 修正手工皂图片更准确一些 (可选让第三个商品不同图片 但保持一致也无伤大雅，为了美观换一个)
    categoriesData.craft[2].img = 'https://images.unsplash.com/photo-1616612423959-4391e70db7b7?w=400&h=400&fit=crop';
    categoriesData.craft[2].modalImg = 'https://images.unsplash.com/photo-1616612423959-4391e70db7b7?w=800&fit=crop';
    
    // 渲染商品列表
    function renderProducts() {
        const foodGrid = document.getElementById('food-grid');
        const craftGrid = document.getElementById('craft-grid');
        const clothGrid = document.getElementById('cloth-grid');
        
        function buildCards(products) {
            return products.map(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                // 储存商品信息，供模态框使用
                card.setAttribute('data-name', product.name);
                card.setAttribute('data-img', product.modalImg);
                card.setAttribute('data-desc', product.desc);
                card.setAttribute('data-price', product.price);
                
                const imgHtml = `<img class="product-img" src="${product.img}" alt="${product.name}" loading="lazy">`;
                const infoHtml = `
                    <div class="product-info">
                        <div class="product-name">
                            <span>${product.name}</span>
                            <span class="product-price">${product.price}<span class="price-unit">฿</span></span>
                        </div>
                        <button class="buy-btn" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}"><i class="fas fa-shopping-cart"></i> 立即购买</button>
                    </div>
                `;
                card.innerHTML = imgHtml + infoHtml;
                // 点击商品卡片（非购买按钮区域）弹出灵动图片弹窗
                card.addEventListener('click', (e) => {
                    // 防止点击购买按钮时触发两次
                    if(e.target.classList && e.target.classList.contains('buy-btn')) return;
                    if(e.target.parentElement && e.target.parentElement.classList && e.target.parentElement.classList.contains('buy-btn')) return;
                    openModal(product.name, product.modalImg, product.desc);
                });
                // 购买按钮事件绑定 独立
                const btn = card.querySelector('.buy-btn');
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showPurchaseToast(product.name, product.price);
                });
                return card;
            });
        }
        
        foodGrid.innerHTML = '';
        craftGrid.innerHTML = '';
        clothGrid.innerHTML = '';
        
        buildCards(categoriesData.food).forEach(card => foodGrid.appendChild(card));
        buildCards(categoriesData.craft).forEach(card => craftGrid.appendChild(card));
        buildCards(categoriesData.clothing).forEach(card => clothGrid.appendChild(card));
    }
    
    // 模态框控制 + 灵动动画
    const modal = document.getElementById('productModal');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const closeModalBtn = document.querySelector('.close-modal');
    
    function openModal(name, imgUrl, desc) {
        modalImage.src = imgUrl;
        modalTitle.innerText = name;
        if(desc) modalDesc.innerText = desc;
        else modalDesc.innerText = '🔥 邦康街头限定商品，即刻拥有泰国风情。';
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
        modal.classList.remove('show');
        document.body.style.overflow = '';
    }
    
    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if(e.target === modal) closeModal();
    });
    
    // 购买弹窗toast
    let toastTimeout = null;
    function showPurchaseToast(productName, price) {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = `🛒 已加入街头购物车 · ${productName} ${price}฿ · 邦康发货 🛒`;
        toast.classList.add('show-toast');
        if(toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show-toast');
        }, 2000);
    }
    
    // 轮播图广告数据 (泰国风情广告)
    const carouselAds = [
        { img: 'https://images.unsplash.com/photo-1552465011-b4e21bf6e79a?w=800&h=350&fit=crop', caption: '🇹🇭 泼水节狂欢 · 邦康街头市集' },
        { img: 'https://images.unsplash.com/photo-1534349762230-e0cadf78f5da?w=800&h=350&fit=crop', caption: '🥭 泰式水果山竹/芒果直送' },
        { img: 'https://images.unsplash.com/photo-1521127082311-1a102a163fdc?w=800&h=350&fit=crop', caption: '🎁 满299泰铢免邮 · 邦康专享' },
        { img: 'https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?w=800&h=350&fit=crop', caption: '🔥 新品手工扎染 · 街头限定系列' }
    ];
    
    let currentSlide = 0;
    let autoInterval;
    const track = document.getElementById('carouselTrack');
    const dotsContainer = document.getElementById('carouselDots');
    
    function buildCarousel() {
        track.innerHTML = '';
        carouselAds.forEach((ad, idx) => {
            const slide = document.createElement('div');
            slide.className = 'carousel-slide';
            slide.innerHTML = `
                <img src="${ad.img}" alt="广告-${idx}" loading="lazy">
                <div class="slide-caption"><i class="fas fa-tag"></i> ${ad.caption}</div>
            `;
            track.appendChild(slide);
        });
        // 动态生成dots
        dotsContainer.innerHTML = '';
        carouselAds.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if(idx === 0) dot.classList.add('active');
            dot.addEventListener('click', () => {
                stopAutoPlay();
                goToSlide(idx);
                startAutoPlay();
            });
            dotsContainer.appendChild(dot);
        });
        updateCarousel();
    }
    
    function updateCarousel() {
        const slideWidth = track.parentElement.clientWidth;
        track.style.transform = `translateX(-${currentSlide * slideWidth}px)`;
        // 更新dots激活状态
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, idx) => {
            if(idx === currentSlide) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    }
    
    function goToSlide(index) {
        if(index >= carouselAds.length) index = 0;
        if(index < 0) index = carouselAds.length - 1;
        currentSlide = index;
        updateCarousel();
    }
    
    function nextSlide() {
        let next = currentSlide + 1;
        if(next >= carouselAds.length) next = 0;
        goToSlide(next);
    }
    
    function startAutoPlay() {
        if(autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(() => {
            nextSlide();
        }, 4000);
    }
    
    function stopAutoPlay() {
        if(autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
        }
    }
    
    // 监听窗口resize重新修正轮播偏移
    let resizeTimer;
    window.addEventListener('resize', () => {
        if(resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if(track) updateCarousel();
        }, 100);
    });
    
    // 触摸滑动简易支持（增强移动体验）
    let startX = 0;
    let isSwiping = false;
    if(track) {
        track.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isSwiping = true;
            stopAutoPlay();
        });
        track.addEventListener('touchmove', (e) => {
            if(!isSwiping) return;
            const moveX = e.touches[0].clientX;
            const diff = moveX - startX;
            if(Math.abs(diff) > 20) {
                if(diff > 0) {
                    // 向右滑动 上一张
                    goToSlide(currentSlide - 1);
                } else {
                    goToSlide(currentSlide + 1);
                }
                isSwiping = false;
                startAutoPlay();
            }
        });
        track.addEventListener('touchend', () => {
            isSwiping = false;
            startAutoPlay();
        });
    }
    
    // 初始化所有
    function init() {
        renderProducts();
        buildCarousel();
        startAutoPlay();
        // 手动修正由于图片加载导致轮播偏移
        setTimeout(() => {
            updateCarousel();
        }, 100);
    }
    
    init();
</script>
</body>
</html>
