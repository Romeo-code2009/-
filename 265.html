<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎰 老虎机 · 幸运点名 (音效修正v2)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: radial-gradient(ellipse at 50% 30%, #7a1a0a, #4a0c0c 60%, #2a0606);
            overflow: hidden;
            user-select: none;
            padding: 16px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 560px;
            z-index: 1;
            position: relative;
        }

        /* ===== 喇叭按钮 ===== */
        .speaker-btn {
            position: absolute;
            top: -8px;
            right: 0;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d4783a, #a0501a);
            border: 2px solid #ffb87a;
            box-shadow: 0 6px 24px rgba(255, 140, 66, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 99;
            color: #fff;
            outline: none;
        }
        .speaker-btn:hover { transform: scale(1.06); }
        .speaker-btn:active { transform: scale(0.94); }
        .speaker-btn.muted {
            background: linear-gradient(145deg, #6a4a3a, #3a2a1a);
            border-color: #8a6a5a;
            color: #aa8a7a;
        }

        .speaker-tip {
            position: absolute;
            top: 58px;
            right: 2px;
            background: rgba(30, 15, 5, 0.9);
            color: #ffb87a;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.4s ease;
        }
        .speaker-tip.hide { opacity: 0; }

        /* ===== 标题 ===== */
        .slot-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff8c42;
            text-shadow: 0 0 40px rgba(255, 140, 66, 0.25), 0 2px 0 #8a4a1a;
            letter-spacing: 6px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slot-title span { font-size: 2rem; }

        /* ===== 老虎机主体 ===== */
        .slot-machine {
            position: relative;
            width: 100%;
            background: linear-gradient(170deg, #2a1a0a, #1a0e05, #0d0804);
            border-radius: 40px 40px 30px 30px;
            padding: 24px 20px 30px;
            border: 4px solid #d4783a;
            border-top-color: #f5a05a;
            border-bottom-color: #a0602a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,160,80,0.15);
        }

        .reels-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 4px 2px;
        }

        .reel {
            flex: 1;
            aspect-ratio: 0.8 / 1;
            max-width: 150px;
            background: radial-gradient(ellipse at 50% 30%, #1a1a2e, #0a0a12);
            border-radius: 16px;
            border: 3px solid #5a3a2a;
            border-top-color: #8a6a4a;
            border-bottom-color: #2a1a1a;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .reel::before {
            content: '';
            position: absolute;
            top: 4%; left: 8%; right: 35%; height: 18%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.07), transparent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .reel::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg,
                rgba(10,10,18,0.85) 0%, rgba(10,10,18,0.3) 18%,
                transparent 35%, transparent 65%,
                rgba(10,10,18,0.3) 82%, rgba(10,10,18,0.85) 100%);
            pointer-events: none;
            z-index: 4;
        }

        .reel.active {
            border-color: #d4783a;
            border-top-color: #f5a05a;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.7), 0 0 40px rgba(255,140,66,0.06);
        }

        .reel.stopped {
            border-color: #f5a05a;
            border-top-color: #ffc080;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.7), 0 0 60px rgba(255,140,66,0.1);
        }

        .reel-window {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            will-change: transform;
            transform: translateY(0);
            backface-visibility: hidden;
        }

        .reel-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-shrink: 0;
            font-size: 2.2rem;
            font-weight: 700;
            color: #f0e6d0;
            padding: 0 4px;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(255,140,66,0.05);
        }

        .reel-item.result-pop {
            animation: resultPop 0.75s cubic-bezier(0.22, 1.6, 0.36, 1) forwards;
            color: #ff8c42 !important;
            text-shadow: 0 0 60px rgba(255,140,66,0.3) !important;
        }

        @keyframes resultPop {
            0% { transform: scale(0.3) rotate(-5deg); opacity: 0; filter: blur(14px); }
            45% { transform: scale(1.22) rotate(2deg); opacity: 1; filter: blur(0); }
            65% { transform: scale(0.92) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
        }

        .reel-lights {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            margin-bottom: 2px;
        }
        .reel-light {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #2a1a1a;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
            transition: all 0.25s ease;
        }
        .reel-light.on {
            background: #ff8c42;
            box-shadow: 0 0 18px rgba(255,140,66,0.6);
        }
        .reel-light.on.green {
            background: #ff6a00;
            box-shadow: 0 0 18px rgba(255,100,0,0.5);
        }

        .slot-controls {
            margin-top: 22px;
            display: flex;
            justify-content: center;
        }

        .btn-spin {
            padding: 18px 52px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(160deg, #f06a20, #d4490a, #b8380a);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 36px rgba(212,73,10,0.4);
            letter-spacing: 4px;
            min-width: 200px;
        }
        .btn-spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); }
        .btn-spin:active:not(:disabled) { transform: translateY(1px) scale(0.96); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.2); }

        .status-text {
            margin-top: 14px;
            font-size: 0.95rem;
            color: rgba(255,140,66,0.3);
            letter-spacing: 2px;
            min-height: 1.8rem;
            text-align: center;
            transition: all 0.4s ease;
        }
        .status-text.active { color: rgba(255,140,66,0.6); animation: statusPulse 0.5s infinite alternate; }
        .status-text.result { color: #ff8c42; font-weight: 600; }
        @keyframes statusPulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        .history-section {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            min-height: 26px;
            width: 100%;
            max-width: 440px;
        }
        .history-tag {
            padding: 2px 14px;
            background: rgba(255,140,66,0.05);
            border: 1px solid rgba(255,140,66,0.06);
            border-radius: 12px;
            font-size: 0.7rem;
            color: rgba(255,140,66,0.25);
            white-space: nowrap;
        }
        .history-tag.highlight {
            color: #ff8c42;
            border-color: rgba(255,140,66,0.15);
        }
        .history-empty {
            color: rgba(255,140,66,0.1);
            font-size: 0.7rem;
            font-weight: 300;
        }

        @media (max-width: 520px) {
            .slot-title { font-size: 1.3rem; letter-spacing: 3px; }
            .slot-title span { font-size: 1.4rem; }
            .slot-machine { padding: 16px 12px 20px; border-radius: 28px; }
            .reels-container { gap: 6px; }
            .reel { border-radius: 12px; border-width: 2px; max-width: 110px; }
            .reel-item { font-size: 1.5rem; }
            .btn-spin { padding: 14px 32px; font-size: 1.1rem; min-width: 160px; }
            .speaker-btn { width: 44px; height: 44px; font-size: 1.4rem; }
            .speaker-tip { font-size: 0.55rem; top: 48px; }
        }
        @media (max-width: 400px) {
            .reel-item { font-size: 1.1rem; }
            .reel { max-width: 85px; }
            .btn-spin { padding: 12px 24px; font-size: 0.95rem; min-width: 130px; }
            .speaker-btn { width: 38px; height: 38px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="speaker-btn" id="speakerBtn" aria-label="切换声音">🔊</button>
        <div class="speaker-tip hide" id="speakerTip">点击开关声音</div>

        <div class="slot-title">
            <span>🎰</span> 幸运老虎机 <span>🎰</span>
        </div>

        <div class="slot-machine">
            <div class="reels-container">
                <div class="reel" id="reel1"><div class="reel-window"><div class="reel-strip" id="strip1"></div></div></div>
                <div class="reel" id="reel2"><div class="reel-window"><div class="reel-strip" id="strip2"></div></div></div>
                <div class="reel" id="reel3"><div class="reel-window"><div class="reel-strip" id="strip3"></div></div></div>
            </div>
            <div class="reel-lights">
                <div class="reel-light" id="light1"></div>
                <div class="reel-light" id="light2"></div>
                <div class="reel-light" id="light3"></div>
                <div class="reel-light" id="light4"></div>
                <div class="reel-light" id="light5"></div>
            </div>
        </div>

        <div class="slot-controls">
            <button class="btn-spin" id="spinBtn"><span class="btn-icon">🎲</span> 开始点名</button>
        </div>

        <div class="status-text" id="statusText">点击按钮 · 幸运降临</div>

        <div class="history-section" id="historySection">
            <span class="history-empty">— 暂无记录 —</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  音频系统 v3 (修正版)
        //  1. 转盘声: 低频颗粒, 点击瞬间响起, 抽中立即停止
        //  2. 恭喜旋律: 4 #2 4 #2 1 -- 4 #2 4 #2 4
        // ================================================================
        let audioCtx = null;
        let soundEnabled = true;

        // 转盘音效节点
        let grainNodes = [];      // 存放所有颗粒的节点，便于统一停止
        let grainGainNode = null;
        let grainStopScheduled = false;

        const speakerBtn = document.getElementById('speakerBtn');
        const speakerTip = document.getElementById('speakerTip');

        function initAudioContext() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function resumeAudioContext() {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        // ---- 强力停止所有转盘音效（杜绝抽中后还在响） ----
        function forceStopAllGrain() {
            // 立即断开增益节点
            if (grainGainNode) {
                try {
                    const now = audioCtx ? audioCtx.currentTime : 0;
                    grainGainNode.gain.cancelScheduledValues(now);
                    grainGainNode.gain.setValueAtTime(0, now);
                    grainGainNode.disconnect();
                } catch (e) {}
                grainGainNode = null;
            }
            // 停止所有已创建的源节点
            grainNodes.forEach(node => {
                try { node.stop(0); } catch (e) {}
                try { node.disconnect(); } catch (e) {}
            });
            grainNodes = [];
            grainStopScheduled = true; // 标记，让调度循环退出
        }

        // ---- 转盘颗粒音效: 低频, 由密到疏, 点击瞬间开始 ----
        function startGrainSound(durationSec) {
            if (!soundEnabled) return;
            initAudioContext();
            if (!audioCtx) return;
            resumeAudioContext();

            // 先强制清掉可能残留的
            forceStopAllGrain();
            grainStopScheduled = false;

            const startTime = audioCtx.currentTime;
            const endTime = startTime + durationSec;

            // 总增益（低频，不刺耳）
            grainGainNode = audioCtx.createGain();
            grainGainNode.gain.value = 0.5;
            grainGainNode.connect(audioCtx.destination);

            // 使用精确的 Web Audio 调度：一次性排好所有颗粒，绝不漂移
            // 间隔从 22ms 逐渐增加到 100ms（由密到疏）
            let t = 0;
            const totalDur = durationSec;
            const minInterval = 0.022;   // 22ms 起手（密集但不刺耳）
            const maxInterval = 0.100;   // 100ms 结尾（一颗一颗）

            while (t < totalDur) {
                const progress = t / totalDur;
                // 间隔用二次曲线增长，早期慢后期快
                const interval = minInterval + (maxInterval - minInterval) * (progress * progress);

                // 在 startTime + t 时刻创建一颗低频颗粒
                createLowFreqGrain(startTime + t, progress);

                t += interval;
            }
        }

        // 创建单颗低频颗粒（不刺耳）
        function createLowFreqGrain(when, progress) {
            if (!audioCtx || !grainGainNode) return;

            // 低频：从 420Hz 降到 220Hz，沉闷厚实
            const baseFreq = 420 - progress * 200; // 420 -> 220
            const volume = 0.28 * (1 - progress * 0.55); // 0.28 -> 0.126

            // ---- 低频振荡脉冲（主体“咚”声）----
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';                    // 正弦波最干净，不刺耳
            osc.frequency.value = baseFreq;

            const oscGain = audioCtx.createGain();
            oscGain.gain.setValueAtTime(0, when);
            oscGain.gain.linearRampToValueAtTime(volume, when + 0.002);
            oscGain.gain.exponentialRampToValueAtTime(0.001, when + 0.035);

            osc.connect(oscGain);
            oscGain.connect(grainGainNode);

            osc.start(when);
            osc.stop(when + 0.04);
            grainNodes.push(osc);

            // ---- 极短的低频噪声（增加“颗粒感”，但用低通滤波去掉刺耳高频）----
            const noiseLen = Math.floor(audioCtx.sampleRate * 0.012);
            const noiseBuffer = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseLen; i++) {
                const decay = Math.exp(-i / (audioCtx.sampleRate * 0.002));
                noiseData[i] = (Math.random() * 2 - 1) * decay;
            }
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;

            // 低通滤波，砍掉高频，让声音厚实不刺耳
            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = baseFreq * 1.5; // 跟随基频，保持低频特性
            lowpass.Q.value = 0.7;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0, when);
            noiseGain.gain.linearRampToValueAtTime(volume * 0.5, when + 0.001);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, when + 0.02);

            noiseSource.connect(lowpass);
            lowpass.connect(noiseGain);
            noiseGain.connect(grainGainNode);

            noiseSource.start(when);
            noiseSource.stop(when + 0.025);
            grainNodes.push(noiseSource);
        }

        // ---- 恭喜发财旋律 (根据用户提供的简谱) ----
        // 简谱: 4 #2 4 #2 1 -- 4 #2 4 #2 4
        // 设 1 = C4 (261.63Hz) 方便计算
        // 4 = F4 (349.23), #2 = D#4 (311.13), 1 = C4 (261.63)
        function playCongratsMelody() {
            if (!soundEnabled) return;
            initAudioContext();
            if (!audioCtx) return;
            resumeAudioContext();

            const now = audioCtx.currentTime;

            // 频率映射 (1 = C4)
            const F4  = 349.23;  // 4
            const Ds4 = 311.13;  // #2
            const C4  = 261.63;  // 1

            // 旋律序列: 4 #2 4 #2 1 -- 4 #2 4 #2 4
            // 用时间轴排布，注意长短
            const melody = [
                { freq: F4,  start: 0.00, dur: 0.28 },  // 4
                { freq: Ds4, start: 0.30, dur: 0.28 },  // #2
                { freq: F4,  start: 0.60, dur: 0.28 },  // 4
                { freq: Ds4, start: 0.90, dur: 0.28 },  // #2
                { freq: C4,  start: 1.20, dur: 0.60 },  // 1 -- (拖长)
                { freq: F4,  start: 1.90, dur: 0.28 },  // 4
                { freq: Ds4, start: 2.20, dur: 0.28 },  // #2
                { freq: F4,  start: 2.50, dur: 0.28 },  // 4
                { freq: Ds4, start: 2.80, dur: 0.28 },  // #2
                { freq: F4,  start: 3.10, dur: 0.50 },  // 4 (收尾)
            ];

            const masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.38;
            masterGain.connect(audioCtx.destination);

            melody.forEach(note => {
                const osc = audioCtx.createOscillator();
                osc.type = 'triangle';   // 温暖，像人声/号角
                osc.frequency.value = note.freq;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0, now + note.start);
                gain.gain.linearRampToValueAtTime(0.6, now + note.start + 0.03);
                gain.gain.linearRampToValueAtTime(0.3, now + note.start + note.dur * 0.55);
                gain.gain.linearRampToValueAtTime(0, now + note.start + note.dur);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(now + note.start);
                osc.stop(now + note.start + note.dur + 0.05);

                // 加一点二次谐波，更明亮但不刺耳
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = note.freq * 2;
                const gain2 = audioCtx.createGain();
                gain2.gain.setValueAtTime(0, now + note.start);
                gain2.gain.linearRampToValueAtTime(0.1, now + note.start + 0.02);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + note.start + note.dur);
                osc2.connect(gain2);
                gain2.connect(masterGain);
                osc2.start(now + note.start);
                osc2.stop(now + note.start + note.dur + 0.05);
            });
        }

        // ---- 声音开关 ----
        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                speakerBtn.textContent = '🔊';
                speakerBtn.classList.remove('muted');
                speakerTip.textContent = '声音已开启';
                initAudioContext();
                resumeAudioContext();
            } else {
                speakerBtn.textContent = '🔇';
                speakerBtn.classList.add('muted');
                speakerTip.textContent = '声音已关闭';
                forceStopAllGrain();
            }
            speakerTip.classList.remove('hide');
            clearTimeout(speakerTip._hideTimer);
            speakerTip._hideTimer = setTimeout(() => speakerTip.classList.add('hide'), 1800);
        }

        speakerBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); });
        speakerBtn.addEventListener('mouseenter', () => speakerTip.classList.remove('hide'));
        speakerBtn.addEventListener('mouseleave', () => {
            if (speakerTip._hideTimer) clearTimeout(speakerTip._hideTimer);
            speakerTip._hideTimer = setTimeout(() => speakerTip.classList.add('hide'), 800);
        });

        document.addEventListener('click', function initOnce() {
            initAudioContext(); resumeAudioContext();
            document.removeEventListener('click', initOnce);
        }, { once: true });

        // ================================================================
        //  转盘逻辑 (保持不变)
        // ================================================================
        const NAMES = [
            '波波老师', '李文勇', '吴大月', '筐建茴', '李克晴',
            '芊珠', '李祖恩', '三达', '张世全',
            '茶田慧', '肖岩布勒', '王雪梅', '玉坎欢', '微微',
            '二英', '玉儿香', '马玉清', '陈岩明', '李尼保',
            '鲍最', '鲍岩长', '李臭臭', '岩明',
            , '陈浩明', '鲍欧勇',
            '大培', '杨双燕', '鲍岩亮', '李尼邦', '岩然（无法选中）'
        ];

        const SPIN_DURATION = 4200;
        const REEL_STOP_DELAYS = [0, 400, 800];
        const TOTAL_SCROLL_ITEMS = 45;

        let isRunning = false;
        let history = [];
        let lastIndex = -1;

        const reelEls = [
            document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')
        ];
        const stripEls = [
            document.getElementById('strip1'), document.getElementById('strip2'), document.getElementById('strip3')
        ];
        const lights = [
            document.getElementById('light1'), document.getElementById('light2'), document.getElementById('light3'),
            document.getElementById('light4'), document.getElementById('light5')
        ];
        const spinBtn = document.getElementById('spinBtn');
        const statusText = document.getElementById('statusText');
        const historySection = document.getElementById('historySection');

        const reelAnims = [null, null, null];
        const reelItemHeights = [0, 0, 0];

        function getRandomName() {
            if (NAMES.length === 0) return '⚠️';
            if (NAMES.length === 1) return NAMES[0];
            let idx, attempts = 0;
            do { idx = Math.floor(Math.random() * NAMES.length); attempts++; if (attempts > 50) break; }
            while (idx === lastIndex && NAMES.length > 1);
            lastIndex = idx;
            return NAMES[idx];
        }

        function getRandomNameExcept(exclude) {
            if (NAMES.length <= 1) return NAMES[0] || '⚠️';
            let name, attempts = 0;
            do { name = getRandomName(); attempts++; if (attempts > 50) break; } while (name === exclude);
            return name;
        }

        function setupReel(reelIndex) {
            const strip = stripEls[reelIndex];
            const reel = reelEls[reelIndex];
            const h = reel.clientHeight / 3;
            reelItemHeights[reelIndex] = h;
            const totalItems = TOTAL_SCROLL_ITEMS + 6;
            let html = '';
            const usedNames = [];
            for (let i = 0; i < totalItems; i++) {
                let name;
                if (i === totalItems - 2) { name = '__TARGET__'; }
                else { name = getRandomNameExcept(usedNames[usedNames.length - 1]); }
                usedNames.push(name);
                html += `<div class="reel-item" style="height:${h}px;">${name === '__TARGET__' ? '?' : name}</div>`;
            }
            strip.innerHTML = html;
            strip.style.transform = 'translateY(0)';
        }

        function animateReel(reelIndex, targetName, duration, delay) {
            const strip = stripEls[reelIndex];
            const reel = reelEls[reelIndex];
            const itemH = reelItemHeights[reelIndex];
            const items = strip.children;
            const totalItems = items.length;
            const targetItemIndex = totalItems - 2;
            items[targetItemIndex].textContent = targetName;
            const finalY = -(targetItemIndex - 1) * itemH;
            let startY = 0;
            const startTime = performance.now();

            if (reelAnims[reelIndex]) { cancelAnimationFrame(reelAnims[reelIndex]); reelAnims[reelIndex] = null; }
            reel.classList.add('active');
            reel.classList.remove('stopped');

            function tick(now) {
                if (!isRunning && now - startTime > duration + 200) return;
                const elapsed = now - startTime - delay;
                if (elapsed < 0) { reelAnims[reelIndex] = requestAnimationFrame(tick); return; }
                const progress = Math.min(elapsed / duration, 1);
                const easeOutExpo = 1 - Math.pow(2, -10 * progress);
                const easeOutQuad = 1 - (1 - progress) * (1 - progress);
                let eased;
                if (progress < 0.7) { eased = easeOutExpo * 0.85 + easeOutQuad * 0.15; }
                else {
                    const p2 = (progress - 0.7) / 0.3;
                    const expoEnd = 1 - Math.pow(2, -10 * 0.7);
                    const quadEnd = 1 - (1 - 0.7) * (1 - 0.7);
                    const mixEnd = expoEnd * 0.85 + quadEnd * 0.15;
                    const softEnd = 1 - Math.pow(1 - p2, 3);
                    eased = mixEnd + (1 - mixEnd) * softEnd;
                }
                const currentY = startY + (finalY - startY) * eased;
                strip.style.transform = `translateY(${currentY}px)`;
                updateBlur(reelIndex, progress);

                if (progress < 1) { reelAnims[reelIndex] = requestAnimationFrame(tick); }
                else {
                    strip.style.transform = `translateY(${finalY}px)`;
                    clearBlur(reelIndex);
                    reelAnims[reelIndex] = null;
                    reel.classList.remove('active');
                    reel.classList.add('stopped');
                    const midIndex = targetItemIndex;
                    if (items[midIndex]) {
                        items[midIndex].classList.add('result-pop');
                        items[midIndex].style.filter = 'none';
                        items[midIndex].style.opacity = '1';
                    }
                    for (let i = 0; i < items.length; i++) { if (i !== midIndex) items[i].classList.remove('result-pop'); }
                }
            }
            reelAnims[reelIndex] = requestAnimationFrame(tick);
        }

        function updateBlur(reelIndex, progress) {
            const strip = stripEls[reelIndex];
            const speed = Math.exp(-3.5 * progress);
            const blurAmount = speed * 8;
            if (blurAmount > 0.5) { strip.style.filter = `blur(${blurAmount}px) brightness(${1 + speed * 0.3})`; }
            else { strip.style.filter = 'none'; }
        }
        function clearBlur(reelIndex) { stripEls[reelIndex].style.filter = 'none'; }

        function setLights(state) {
            if (state === 'idle') { lights.forEach((l, i) => { l.className = 'reel-light'; if (i % 2 === 0) l.classList.add('on'); }); }
            else if (state === 'spinning') { lights.forEach(l => { l.className = 'reel-light on'; }); }
            else if (state === 'result') { lights.forEach(l => { l.className = 'reel-light on green'; }); }
            else { lights.forEach(l => { l.className = 'reel-light'; }); }
        }

        function startSpin() {
            if (isRunning) return;
            if (NAMES.length === 0) { statusText.textContent = '⚠️ 名单为空'; statusText.className = 'status-text'; return; }

            initAudioContext(); resumeAudioContext();

            // ★ 点击瞬间立即响起转盘音效 (精确调度，不会时响时不响)
            if (soundEnabled) {
                startGrainSound(SPIN_DURATION / 1000 + 0.5);
            }

            isRunning = true;
            const targetName = getRandomName();
            document.querySelectorAll('.history-tag.highlight').forEach(el => el.classList.remove('highlight'));
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<span class="btn-icon">🎰</span> 转动中...';
            statusText.textContent = '🎰 转盘飞转 · 好运快来！';
            statusText.className = 'status-text active';
            setLights('spinning');

            for (let i = 0; i < 3; i++) setupReel(i);
            for (let i = 0; i < 3; i++) {
                const delay = REEL_STOP_DELAYS[i];
                const duration = SPIN_DURATION + (i * 50);
                animateReel(i, targetName, duration, 0);
            }

            const totalDuration = SPIN_DURATION + REEL_STOP_DELAYS[2] + 600;
            setTimeout(() => finishSpin(targetName), totalDuration);
        }

        function finishSpin(targetName) {
            if (!isRunning) return;
            isRunning = false;

            // ★ 抽到人: 强制立即停止所有转盘音效 (杜绝还在响)
            forceStopAllGrain();

            // ★ 播放正确的恭喜旋律 (4 #2 4 #2 1 -- 4 #2 4 #2 4)
            if (soundEnabled) {
                // 稍微延迟一点，等转盘音效彻底断开
                setTimeout(() => {
                    if (soundEnabled) playCongratsMelody();
                }, 80);
            }

            for (let i = 0; i < 3; i++) {
                const strip = stripEls[i];
                const items = strip.children;
                strip.style.filter = 'none';
                for (let j = 0; j < items.length; j++) items[j].classList.remove('result-pop');
                const itemH = reelItemHeights[i];
                const finalY = parseFloat(strip.style.transform.replace('translateY(', '').replace('px)', '')) || 0;
                const midIndex = Math.round(-finalY / itemH) + 1;
                if (items[midIndex]) {
                    items[midIndex].textContent = targetName;
                    items[midIndex].classList.add('result-pop');
                    items[midIndex].style.color = '#ff8c42';
                    items[midIndex].style.textShadow = '0 0 60px rgba(255,140,66,0.3)';
                }
                reelEls[i].classList.remove('active');
                reelEls[i].classList.add('stopped');
            }

            setLights('result');
            statusText.textContent = `🎉 恭喜 「${targetName}」 被点中！`;
            statusText.className = 'status-text result';
            spinBtn.disabled = false;
            spinBtn.innerHTML = '<span class="btn-icon">🎲</span> 再来一次';
            addHistory(targetName);

            setTimeout(() => { if (!isRunning) setLights('idle'); }, 4500);
        }

        function addHistory(name) { history.push(name); renderHistory(); }
        function renderHistory() {
            historySection.innerHTML = '';
            if (history.length === 0) {
                const empty = document.createElement('span');
                empty.className = 'history-empty';
                empty.textContent = '— 暂无记录 —';
                historySection.appendChild(empty);
                return;
            }
            const show = history.slice(-12).reverse();
            show.forEach((name, idx) => {
                const tag = document.createElement('span');
                tag.className = 'history-tag';
                if (idx === 0) tag.classList.add('highlight');
                tag.textContent = name;
                historySection.appendChild(tag);
            });
        }

        spinBtn.addEventListener('click', startSpin);
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); if (!spinBtn.disabled) spinBtn.click(); }
        });
        historySection.addEventListener('dblclick', () => {
            history = []; renderHistory();
            if (!isRunning) {
                statusText.textContent = '✨ 已清空记录';
                statusText.className = 'status-text';
                setTimeout(() => { if (!isRunning) { statusText.textContent = '点击按钮 · 幸运降临'; statusText.className = 'status-text'; } }, 1200);
            }
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (!isRunning) for (let i = 0; i < 3; i++) setupReel(i); }, 200);
        });

        function init() {
            for (let i = 0; i < 3; i++) setupReel(i);
            renderHistory();
            setLights('idle');
            speakerTip.classList.add('hide');
        }
        requestAnimationFrame(() => requestAnimationFrame(init));

        console.log('🎰 老虎机点名器 v6 (低频颗粒音效 + 正确旋律)');
    </script>
</body>
