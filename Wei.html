<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 魏思粒 · 马年烟火 & 神奇马宠 ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 30%, #0a0f2e, #030514);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', '华文楷体', 'Microsoft YaHei', cursive, sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* 流动星云 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="glow" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="%23ffb347" stop-opacity="0.1"/><stop offset="80%" stop-color="%234a2c9e" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="url(%23glow)"/></svg>');
            opacity: 0.6;
            pointer-events: none;
            animation: slowDrift 40s infinite alternate;
        }
        @keyframes slowDrift {
            0% { transform: scale(1) rotate(0deg); opacity: 0.4; }
            100% { transform: scale(1.2) rotate(3deg); opacity: 0.8; }
        }

        .card {
            position: relative;
            max-width: 850px;
            width: 100%;
            background: rgba(10, 8, 25, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 120, 0.4);
            border-radius: 60px 60px 40px 40px;
            padding: 50px 40px 60px 40px;
            box-shadow: 0 40px 70px rgba(0,0,0,0.8), 0 0 0 2px #ffd97833, 0 0 50px #ffb56b;
            z-index: 10;
            overflow: hidden;
        }
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 5;
            color: #fff9e6;
            text-shadow: 0 0 10px #f99f4c, 0 0 30px #c57cff, 2px 4px 8px black;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 有趣的马宠物组件 ===== */
        .magic-horse {
            position: relative;
            margin: 10px 0 0px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s ease;
            z-index: 30;
        }
        .magic-horse:active {
            transform: scale(0.95);
        }
        .horse-pet {
            font-size: 6rem;
            line-height: 1;
            filter: drop-shadow(0 0 25px #ffae42) drop-shadow(0 0 55px #ff4da6);
            animation: floatHorse 2.2s infinite alternate ease-in-out;
            transform-origin: center;
            transition: all 0.2s;
        }
        @keyframes floatHorse {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-12px) rotate(2deg); }
        }
        /* 马蹄子底下的小火花 */
        .hoof-spark {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            background: radial-gradient(ellipse at center, #ffdb7c, transparent 80%);
            filter: blur(8px);
            opacity: 0.7;
            border-radius: 50%;
            z-index: -1;
        }
        /* 提示标签 */
        .click-hint {
            background: rgba(255,200,100,0.2);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #ffdba5;
            border: 1px solid #ffb46e;
            margin-top: 5px;
            letter-spacing: 2px;
            box-shadow: 0 0 20px #ff9f4a;
        }

        /* 祝福语弹窗 - 有趣物理效果 */
        .bubble-message {
            position: absolute;
            top: 20px;
            right: -30px;
            max-width: 280px;
            background: rgba(20, 15, 35, 0.9);
            backdrop-filter: blur(16px);
            border: 3px solid #ffcf7a;
            border-radius: 50px 20px 50px 20px;
            padding: 20px 25px;
            color: #ffefc0;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 50px #ffbf40, 0 0 0 2px #ffd27f inset;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
            transform-origin: top right;
            line-height: 1.4;
            white-space: nowrap;
        }
        .bubble-message span {
            display: inline-block;
            background: linear-gradient(145deg, #ffd966, #ffb284);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
        }
        .bubble-message.show {
            opacity: 1;
            animation: bouncePop 0.7s cubic-bezier(0.28, 1.5, 0.55, 1) forwards;
        }
        @keyframes bouncePop {
            0% { transform: scale(0.2) translate(50px, -40px); opacity: 0; }
            40% { transform: scale(1.2) translate(-8px, 15px); opacity: 1; }
            70% { transform: scale(0.95) translate(3px, -5px); }
            100% { transform: scale(1) translate(0, 0); opacity: 1; }
        }

        .greeting-name {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffe898, #ffc1a1, #ffb5f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px #ffae42, 0 0 70px #ff4da6;
            margin-bottom: 10px;
            border-bottom: 3px solid #ffcf9a;
            padding-bottom: 10px;
        }

        .greeting-sub {
            font-size: 2rem;
            font-weight: 300;
            background: rgba(255, 215, 150, 0.15);
            padding: 10px 30px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            margin-bottom: 15px;
            color: #ffecb3;
            border: 1px solid #ffc491;
        }

        .bless-box {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border-left: 8px solid #ffb259;
            border-right: 8px solid #ff9fcd;
            border-radius: 50px 20px 50px 20px;
            padding: 30px 35px;
            margin: 20px 0;
            box-shadow: inset 0 0 40px #ffc76433, 0 20px 30px black;
            font-size: 1.4rem;
            line-height: 2rem;
            text-align: center;
        }

        .bless-box .highlight {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffd966, #ffb284);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 25px #ff5900);
        }

        .firework-emoji-line {
            font-size: 2.5rem;
            letter-spacing: 12px;
            filter: drop-shadow(0 0 10px cyan);
            margin: 20px 0 10px;
        }

        .closing {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd966, #ffb6c1, #b4a5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 30px;
            text-align: center;
        }

        .signature {
            font-size: 1.7rem;
            margin-top: 15px;
            font-style: italic;
            border-top: 2px dashed #ffc891;
            padding-top: 25px;
            width: 100%;
            text-align: center;
            color: #ffe0a3;
        }

        .ground-spark {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: radial-gradient(circle at 20% 100%, #ffec80, transparent 50%),
                        radial-gradient(circle at 80% 100%, #ff7676, transparent 50%),
                        radial-gradient(circle at 50% 100%, #c17eff, transparent 60%);
            filter: blur(20px);
            opacity: 0.7;
            z-index: 1;
            animation: groundGlow 3s infinite alternate;
        }
        @keyframes groundGlow {
            0% { opacity: 0.5; filter: blur(25px); }
            100% { opacity: 0.9; filter: blur(15px); }
        }

        /* 手动星星 */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px gold;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="fireworks-canvas"></canvas>
    <div id="stars-container"></div>

    <div class="card">
        <div class="ground-spark"></div>

        <div class="content">
            <!-- ===== 有趣的马宠物组件 (点击触发) ===== -->
            <div class="magic-horse" id="horsePet">
                <div class="horse-pet" id="horseEmoji">🐴✨🔥</div>
                <div class="hoof-spark"></div>
                <div class="click-hint">👆 快按按我！有马啸～</div>
                <!-- 弹窗祝福语气泡 (初始隐藏) -->
                <div id="blessBubble" class="bubble-message">
                    <span>魏思粒</span> 🎇<br>
                    马到成功 · 难关踏平 💪<br>
                    🐎 加油！姐姐最棒！
                </div>
            </div>

            <div class="greeting-name">魏思粒 · 姐姐</div>
            <div class="greeting-sub">🔥 丙午马年 · 专属烟火 🔥</div>

            <div class="bless-box">
                <p>
                    <span class="highlight">魏思粒</span>，我最勇敢的姐姐<br>
                    当万马奔腾踏破长夜，<br>
                    漫天烟火皆为你绽放。<br>
                </p>
                <div class="firework-emoji-line">🎇🎆✨🌟🎇</div>
                <p>
                    <strong>生活顺利 · 事业美满</strong> —— 是这烟火许你的诺言。<br>
                    那些暂时的难关、疲惫的瞬间，<br>
                    会像升空的礼花一样，<strong class="highlight">炸裂成光，散落成星</strong>。<br>
                </p>
                <p>
                    🌠 丙午新岁，愿你马蹄所至皆是坦途，<br>
                    指尖所触皆有热望。工作中破竹而上，<br>
                    生活里处处惊喜。<br>
                </p>
                <p style="font-size:1.8rem; margin:15px 0;">
                    💥 挺过难关，再加油 💥
                </p>
            </div>

            <div class="closing">
                魏思粒 · 马年大吉 🐴🎇
            </div>
            <div class="signature">
                —— 永远爱你的帅气的有魅力的弟弟💌
            </div>
        </div>
    </div>

    <div style="position: fixed; bottom: 10px; right: 15px; color: #ffcf9a; opacity:0.5; font-size:0.8rem; z-index:99;">✨ 按马有惊喜 · 马啸+祝福 ✨</div>

    <script>
        (function() {
            // ------------------------------
            // 1. 烟花特效 (同前，略加强)
            // ------------------------------
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            function resizeCanvas() {
                const card = document.querySelector('.card');
                const rect = card.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                canvas.width = width;
                canvas.height = height;
            }

            function randomColor() {
                const hue = Math.random() * 360;
                return `hsl(${hue}, ${70 + Math.random() * 30}%, ${70 + Math.random() * 25}%)`;
            }

            class Particle {
                constructor(x, y, vx, vy, color, size, life) {
                    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                    this.color = color; this.size = size; this.life = life; this.maxLife = life;
                }
                update() {
                    this.x += this.vx; this.y += this.vy; this.vy += 0.02;
                    this.life -= 1; this.size *= 0.99;
                }
                draw() {
                    if (this.life <= 0) return;
                    ctx.globalAlpha = Math.min(1, (this.life / this.maxLife) * 1.2);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            function createFirework(px = null, py = null) {
                let x, y;
                if (px && py) { x = px; y = py; }
                else { x = 20 + Math.random() * (width - 40); y = 20 + Math.random() * (height * 0.7); }
                const particleCount = 60 + Math.floor(Math.random() * 70);
                const baseColor = randomColor();
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.2 + Math.random() * 3.5;
                    const vx = Math.cos(angle) * speed * (Math.random() + 0.5);
                    const vy = Math.sin(angle) * speed * (Math.random() + 0.5) - 1;
                    const size = 2.5 + Math.random() * 4;
                    const life = 80 + Math.floor(Math.random() * 60);
                    let color = (Math.random() > 0.4) ? baseColor : randomColor();
                    particles.push(new Particle(x, y, vx, vy, color, size, life));
                }
            }

            function addTrailSpark() {
                for (let i=0; i<3; i++) {
                    const x = 30 + Math.random() * (width - 60);
                    const y = height - 10 - Math.random() * 40;
                    const vx = (Math.random() - 0.5) * 0.4;
                    const vy = -1.6 - Math.random() * 2.2;
                    const color = `hsl(${20 + Math.random()*40}, 90%, 75%)`;
                    const size = 2 + Math.random() * 5;
                    const life = 30 + Math.floor(Math.random() * 30);
                    particles.push(new Particle(x, y, vx, vy, color, size, life));
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].life <= 0 || particles[i].y > height + 20 || particles[i].x < -20 || particles[i].x > width+20) {
                        particles.splice(i, 1);
                    } else {
                        particles[i].draw();
                    }
                }
                if (Math.random() < 0.06 && particles.length < 500) createFirework();
                if (Math.random() < 0.4) addTrailSpark();
                requestAnimationFrame(animate);
            }

            // 星星背景
            function initStars() {
                const starsContainer = document.getElementById('stars-container');
                starsContainer.style.position = 'absolute';
                starsContainer.style.inset = '0';
                starsContainer.style.pointerEvents = 'none';
                starsContainer.style.zIndex = '1';
                for (let i = 0; i < 70; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = 1 + Math.random() * 3;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.background = `rgb(255, ${200 + Math.random()*55}, ${150 + Math.random()*105})`;
                    star.style.boxShadow = `0 0 ${8+Math.random()*20}px gold`;
                    star.style.animation = `twinkle ${2+Math.random()*5}s infinite alternate`;
                    starsContainer.appendChild(star);
                }
            }
            const styleSheet = document.createElement("style");
            styleSheet.textContent = `@keyframes twinkle { 0% { opacity: 0.2; transform: scale(1); } 100% { opacity: 1; transform: scale(1.3); } }`;
            document.head.appendChild(styleSheet);

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            initStars();
            setTimeout(() => {
                for (let i=0; i<8; i++) {
                    setTimeout(() => { if (width && height) createFirework(width * (0.2+0.6*Math.random()), height * (0.2+0.5*Math.random())); }, i * 100);
                }
            }, 200);
            animate();

            // ------------------------------
            // 2. 有趣的马宠物：马啸+祝福语弹窗
            // ------------------------------
            const horse = document.getElementById('horsePet');
            const bubble = document.getElementById('blessBubble');
            // 创建音频上下文 (因为浏览器限制，必须由用户手势触发)
            let audioCtx = null;
            let isAudioReady = false;

            function playHorseNeigh() {
                // 使用 Web Audio API 合成一声马嘶 (高频+低频混合，短促)
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().then(() => { synthesizeNeigh(); });
                } else {
                    synthesizeNeigh();
                }
            }

            function synthesizeNeigh() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;

                // 主音：类似马嘶的滑音 + 颤音 (两个振荡器)
                const osc1 = audioCtx.createOscillator();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(520, now);
                osc1.frequency.exponentialRampToValueAtTime(780, now + 0.2);
                osc1.frequency.exponentialRampToValueAtTime(430, now + 0.4);

                const osc2 = audioCtx.createOscillator();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(300, now);
                osc2.frequency.exponentialRampToValueAtTime(620, now + 0.18);
                osc2.frequency.exponentialRampToValueAtTime(360, now + 0.38);

                // 增益包络
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.01, now);
                gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.1, now + 0.3);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                // 加一点高频哼鸣
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                filter.Q.value = 2;

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.8);
                osc2.stop(now + 0.75);
            }

            // 点击马事件
            horse.addEventListener('click', (e) => {
                e.stopPropagation();
                // 播放马啸
                playHorseNeigh();

                // 移除之前的动画类，重新添加以触发弹跳
                bubble.classList.remove('show');
                // 强制重绘
                void bubble.offsetWidth;
                bubble.classList.add('show');

                // 同时让马儿有个开心的反应
                const horseEmoji = document.getElementById('horseEmoji');
                horseEmji = horseEmoji; // 小写也无妨
                horseEmoji.style.transform = 'scale(1.2) rotate(5deg)';
                setTimeout(() => {
                    horseEmoji.style.transform = '';
                }, 200);

                // 再额外放一朵小烟花在马周围 (增加气氛)
                if (width && height) {
                    const rect = horse.getBoundingClientRect();
                    const cardRect = document.querySelector('.card').getBoundingClientRect();
                    // 相对卡片坐标
                    const x = rect.left + rect.width/2 - cardRect.left;
                    const y = rect.top + rect.height/3 - cardRect.top;
                    for (let i=0; i<3; i++) {
                        setTimeout(() => {
                            createFirework(x + (Math.random()-0.5)*50, y + (Math.random()-0.5)*40);
                        }, i*30);
                    }
                }
            });

            // 确保音频在第一次点击时可用 (iOS等)
            horse.addEventListener('touchstart', (e) => {
                e.preventDefault(); // 防止双击缩放干扰，但保留点击
                // 其实不用额外处理，上面click会触发
            }, { passive: false });

            // 弹窗物理效果已由CSS实现
        })();
    </script>
</body>
</html>
