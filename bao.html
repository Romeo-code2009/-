<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C级通缉令 - 李亚保</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#222;
  padding:15px;
  font-family:"Microsoft YaHei",sans-serif;
}
.wanted{
  max-width:600px;
  margin:0 auto;
  background:#fffef0;
  border:8px solid #333;
  border-radius:6px;
  overflow:hidden;
}
.head{
  background:#8b0000;
  color:#fff;
  text-align:center;
  padding:14px;
  font-size:24px;
  font-weight:bold;
  letter-spacing:3px;
}
.level{
  background:#222;
  color:#ffcc00;
  text-align:center;
  padding:10px;
  font-size:18px;
  font-weight:bold;
}
/* 手机优先：图片直接放等级下面 */
.photo-box{
  width:100%;
  padding:20px;
  text-align:center;
}
.photo-box img{
  width:80%;
  max-width:280px;
  border:4px solid #333;
  border-radius:4px;
  background:#ccc;
}
.info{
  padding:0 25px 30px;
}
.name{
  font-size:36px;
  font-weight:bold;
  color:#8b0000;
  text-align:center;
  margin-bottom:20px;
}
.item{
  margin:14px 0;
  font-size:17px;
  line-height:1.6;
}
.label{
  font-weight:bold;
  color:#444;
}
.reward{
  background:#222;
  color:#ffcc00;
  text-align:center;
  padding:14px;
  border-radius:6px;
  font-size:24px;
  font-weight:bold;
  margin:25px 0;
}
.desc{
  color:#333;
  line-height:1.7;
  text-align:justify;
}
</style>
</head>
<body>
<div class="wanted">
  <div class="head">通 缉 令</div>
  <div class="level">C级通缉犯</div>

  <!-- 手机优先：标题下面直接放图片 -->
  <div class="photo-box">
    <img src="bao.png" alt="嫌疑人李亚保照片">
  </div>

  <div class="info">
    <div class="name">李亚保</div>
    <div class="item"><span class="label">涉嫌罪名：</span>强奸罪</div>
    <div class="item"><span class="label">通缉等级：</span>C级全国协查</div>
    
    <div class="reward">悬赏：¥5.00</div>

    <div class="desc">
      犯罪嫌疑人李亚保涉嫌强奸犯罪，案发后潜逃。现被列为C级在逃通缉人员。
      凡提供有效线索协助抓捕者，奖励人民币5元。
      请广大群众提高警惕，发现线索立即拨打110报警。
    </div>
  </div>
</div>
</body>
</html>
